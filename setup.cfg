[metadata]
name = diffusion_mlp_cnn
version = 0.0.1
author = Malyadeep Bhattacharya, Prehas Madke
author_email = malyadeep1999@gmail.com
url = https://github.com/Malyadeep/diffusion-mlp-cnn
description = A package learning diffusion operator using
long_description = file: README.md
long_description_content_type = text/markdown
keywords = Neural Networks, Deep learning
license = BSD 3-Clause License
classifiers = 
    License :: OSI Approved :: BSD 3-Clause License
    Programming Language :: Python :: 3

[options]
packages = find:
zip_safe = True
include_package_data = True
install_requires =
    numpy >= 2.4.4
    torch >= 2.14.0
    matplotlib >= 3.10.9

[options.extras_require]
dev = 
    flake8==6.0.0

[project.urls]
"Homepage" = https://github.com/Malyadeep/diffusion-mlp-cnn
